# Mosquitto config.
# DEV MODE: anonymous on 1883. Do not ship this.
# Production checklist (uncomment + provision):
#   1. TLS listener 8883 with Let's Encrypt certs
#   2. allow_anonymous false
#   3. password_file with one entry per device (username = device_id,
#      password = API key) — the backend writes this file at registration
#   4. ACL: device X may publish only devices/X/#

persistence true
persistence_location /mosquitto/data/

listener 1883
allow_anonymous true

